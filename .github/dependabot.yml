version: 2
updates:
  # The app has no dependencies, so GitHub Actions is the only ecosystem.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    # A new action release waits a week before it is proposed here. A
    # compromised release is usually found and pulled within that time.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
