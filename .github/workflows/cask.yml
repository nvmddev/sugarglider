name: Homebrew cask

# Publishes the cask of an existing release to the tap. release.yml calls it as
# its last step; the manual trigger retries a cask that didn't make it without
# re-releasing, and is the only way to test this job.
on:
  workflow_call:
    inputs:
      version:
        description: "Version to publish, without the leading v"
        required: true
        type: string
    secrets:
      HOMEBREW_TAP_TOKEN:
        description: "Fine-grained PAT with contents:write on the tap repo. Unset = skip."
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (blank = the latest release)"
        type: string
        default: ""

permissions:
  contents: read

# Queued: two concurrent updates of the one cask file would fight each other.
concurrency:
  group: homebrew-cask
  cancel-in-progress: false

jobs:
  cask:
    name: Push cask to tap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve version and checksum
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # --repo throughout: gh would otherwise infer the repository from the
          # checkout's git remote.
          version="${INPUT_VERSION}"
          if [[ -z "${version}" ]]; then
            version="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq '.tagName')"
            version="${version#v}"
            echo "No version given. Using the latest release: ${version}"
          fi

          # The value flows into sed replacements and shell paths below: a
          # malformed one must fail here, not corrupt the published cask.
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::invalid version '${version}': expected MAJOR.MINOR.PATCH"
            exit 1
          }

          # Read from the release itself, so the cask describes what is published.
          gh release download "v${version}" --repo "${GITHUB_REPOSITORY}" \
            --pattern checksums.txt --dir "${RUNNER_TEMP}"
          zip="Sugarglider-${version}.zip"
          sha256="$(awk -v f="${zip}" '$2 == f { print $1 }' "${RUNNER_TEMP}/checksums.txt")"
          if [[ -z "${sha256}" ]]; then
            echo "::error::No entry for ${zip} in the checksums.txt of release v${version}."
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha256=${sha256}"   >> "$GITHUB_OUTPUT"
          echo "Cask for ${version} (zip sha256 ${sha256})" >> "$GITHUB_STEP_SUMMARY"

      - name: Push cask to tap
        env:
          # Fine-grained PAT with contents:write on the tap repo. Unset = skip.
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          VERSION: ${{ steps.resolve.outputs.version }}
          SHA256: ${{ steps.resolve.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set, so the cask update is skipped."
            exit 0
          fi
          TAP_REPO="${TAP_REPO:-${GITHUB_REPOSITORY_OWNER}/homebrew-tap}"

          gh repo clone "${TAP_REPO}" tap -- --depth=1
          mkdir -p tap/Casks
          sed -e "s|__VERSION__|${VERSION}|g" \
              -e "s|__SHA256__|${SHA256}|g" \
              -e "s|__REPO__|${GITHUB_REPOSITORY}|g" \
              .github/homebrew/sugarglider.rb.tmpl > tap/Casks/sugarglider.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Compared staged: a plain git diff ignores the cask while it's a new,
          # untracked file.
          git add Casks/sugarglider.rb
          if git diff --cached --quiet; then
            echo "Cask already at ${VERSION}."
            exit 0
          fi
          git commit -m "sugarglider ${VERSION}"

          # GH_TOKEN authenticates gh, not git, and the remote gh repo clone
          # leaves behind carries no credential: without the token in the URL
          # the push dies with "could not read Username".
          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${TAP_REPO}.git"
          # -u origin HEAD: a tap created without a commit clones to an unborn
          # branch with no upstream.
          if ! git push -u origin HEAD; then
            echo "::error::Push to ${TAP_REPO} failed. HOMEBREW_TAP_TOKEN needs contents:write on that repository."
            exit 1
          fi
