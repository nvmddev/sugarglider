name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Derives the version and creates the tag itself.
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = derive from Conventional Commits)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto
      dry_run:
        description: "Build and package, but don't tag or publish"
        type: boolean
        default: false

permissions:
  contents: write

# Queued: cancelling could leave a release half-published.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build & publish
    # The image and the Xcode of CI's newest-Xcode job, so the release ships
    # what that job tests. Bump the label together with ci.yml.
    runs-on: xcode-27
    # Two sequential notarizations of up to 30 min each; 90 min leaves room.
    timeout-minutes: 90
    permissions:
      contents: write # tag, release assets, changelog branch
      pull-requests: write # the changelog PR
      id-token: write # sign the build provenance attestation
      attestations: write # store the attestation
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # version + changelog need the full tag/commit history

      # Never a beta or a release candidate; see the script.
      - name: Select the newest stable Xcode
        run: |
          developer_dir="$(scripts/newest-xcode.sh)"
          echo "DEVELOPER_DIR=${developer_dir}" >> "$GITHUB_ENV"
          DEVELOPER_DIR="${developer_dir}" xcodebuild -version

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'auto' }}
          DRY_RUN: ${{ inputs.dry_run }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # A real release publishes what it built, so it comes from the default branch only.
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${DEFAULT_BRANCH}"; then
              echo "::error::${GITHUB_REF_NAME} is not on ${DEFAULT_BRANCH}. Releases run from ${DEFAULT_BRANCH} only."
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
            previous="$(scripts/version.sh previous "${GITHUB_REF_NAME}")"
          else
            if [[ "${DRY_RUN}" != "true" && "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]]; then
              echo "::error::Releases run from ${DEFAULT_BRANCH} only. Use dry_run to test another branch."
              exit 1
            fi
            version="$(scripts/version.sh next "${BUMP}")"
            previous="$(scripts/version.sh latest)"
            if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
              echo "::error::Tag v${version} already exists. Pick an explicit bump or delete the tag."
              exit 1
            fi
            # Only auto is guarded: an explicit bump or a pushed tag ships regardless.
            if [[ "${BUMP}" == "auto" ]] && ! scripts/version.sh app-changed; then
              echo "::error::Nothing under Sources/, Resources/ or Sugarglider.xcodeproj changed since ${previous}, so the built app would be byte-identical. Re-run with bump=patch (or minor/major) to release anyway."
              exit 1
            fi
          fi
          # Flows into file names, the tag and GITHUB_ENV.
          [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::invalid version '${version}': expected MAJOR.MINOR.PATCH"
            exit 1
          }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          # Every later step reads both from the environment.
          echo "VERSION=${version}"   >> "$GITHUB_ENV"
          echo "PREVIOUS=${previous}" >> "$GITHUB_ENV"
          echo "Releasing ${version} (previous: ${previous:-none})" >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        run: scripts/test.sh

      - name: Import signing certificate
        id: signing
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CERT_P12}" ]]; then
            echo "identity=-"      >> "$GITHUB_OUTPUT"
            echo "notarize=false"  >> "$GITHUB_OUTPUT"
            echo "::warning::No MACOS_CERTIFICATE_P12 secret, so the build is ad-hoc signed. Downloads stay Gatekeeper-quarantined; see the release notes."
            exit 0
          fi
          identity="$(scripts/import-signing-certificate.sh)"
          echo "Signing as: ${identity}"
          echo "identity=${identity}" >> "$GITHUB_OUTPUT"
          if [[ -n "${APPLE_ID}" ]]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed but not notarized (APPLE_ID secret missing)."
          fi

      # Without the profile the app can't own its Keychain item, so the token
      # falls back to the login Keychain, which asks for access after every update.
      - name: Install provisioning profile
        if: steps.signing.outputs.identity != '-'
        env:
          PROFILE: ${{ secrets.MACOS_PROVISION_PROFILE }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${PROFILE}" || -z "${TEAM_ID}" ]]; then
            echo "::warning::No MACOS_PROVISION_PROFILE/APPLE_TEAM_ID, so the app will ask once for Keychain access after each update."
            exit 0
          fi
          printf '%s' "${PROFILE}" | base64 --decode > Resources/embedded.provisionprofile
          echo "Provisioning profile installed"

      - name: Build app bundle
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ./build.sh

      - name: Package ZIP
        run: |
          set -euo pipefail
          mkdir -p dist
          ditto -c -k --keepParent Sugarglider.app "dist/Sugarglider-${VERSION}.zip"

      - name: Notarize app
        if: steps.signing.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          scripts/notarize.sh "dist/Sugarglider-${VERSION}.zip"
          xcrun stapler staple Sugarglider.app
          # A zip can't carry a ticket, so zip the stapled app again: the
          # download then passes Gatekeeper without a network round-trip.
          rm "dist/Sugarglider-${VERSION}.zip"
          ditto -c -k --keepParent Sugarglider.app "dist/Sugarglider-${VERSION}.zip"

      - name: Package DMG
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: scripts/make-dmg.sh

      - name: Notarize DMG
        if: steps.signing.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/notarize.sh "dist/Sugarglider-${VERSION}.dmg" --staple

      # Signing degrades silently, so a green run alone proves nothing about
      # Gatekeeper. This fails the release instead of publishing quarantined downloads.
      - name: Verify notarization
        if: steps.signing.outputs.notarize == 'true'
        run: scripts/verify-notarization.sh "dist/Sugarglider-${VERSION}.zip" "dist/Sugarglider-${VERSION}.dmg"

      # cask.yml reads the zip's hash back out of this release asset.
      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          shasum -a 256 "Sugarglider-${VERSION}.zip" "Sugarglider-${VERSION}.dmg" > checksums.txt
          cat checksums.txt

      - name: Generate release notes
        env:
          NOTARIZED: ${{ steps.signing.outputs.notarize }}
        run: |
          set -euo pipefail
          scripts/release-notes.sh "${VERSION}" "${PREVIOUS}" HEAD > "${RUNNER_TEMP}/notes.md"
          cat "${RUNNER_TEMP}/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Sugarglider-${{ env.VERSION }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

      # Ties the release downloads to this workflow run and the tagged commit:
      # `gh attestation verify` then proves the byte files came from here, which
      # neither the signature nor the notarization alone can say.
      - name: Attest the release artifacts
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-checksums: dist/checksums.txt

      - name: Create tag
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        run: |
          set -euo pipefail
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          # Pushes authenticated with GITHUB_TOKEN don't trigger workflows, so
          # this cannot loop back into this workflow's own tag trigger.
          git push origin "v${VERSION}"

      - name: Publish GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "v${VERSION}" \
            --title "Sugarglider ${VERSION}" \
            --notes-file "${RUNNER_TEMP}/notes.md" \
            --verify-tag \
            "dist/Sugarglider-${VERSION}.zip" \
            "dist/Sugarglider-${VERSION}.dmg" \
            "dist/checksums.txt"

      # The default branch's ruleset requires a pull request, and
      # github-actions[bot] can't be a bypass actor on a personal repo, so the
      # changelog arrives as a PR that merges itself.
      - name: Open changelog PR
        if: ${{ !inputs.dry_run }}
        env:
          # Nothing GITHUB_TOKEN pushes or opens starts a workflow run, so the
          # PR's required checks would wait forever. With RELEASE_PAT the push
          # and the PR are ordinary user events that trigger CI; the PR still
          # passes the same gate as any other.
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          HAS_PAT: ${{ secrets.RELEASE_PAT != '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: scripts/changelog-pr.sh "${VERSION}" "${PREVIOUS}"

  homebrew:
    name: Update Homebrew cask
    needs: release
    if: ${{ !inputs.dry_run }}
    uses: ./.github/workflows/cask.yml
    with:
      version: ${{ needs.release.outputs.version }}
    # Named, not inherit: the cask job uses exactly one secret, and inherit
    # would hand it the whole signing and notarization set.
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
