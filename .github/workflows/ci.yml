name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    # Pinned rather than macos-latest so a runner-image rollover can't turn a
    # green branch red overnight. Bump deliberately.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # The icon artifacts are generated but committed, because compiling them
      # needs a full Xcode 26+ that this runner doesn't have. This is the guard
      # against the artwork being edited without a recompile: the check itself
      # is just a hash, no Xcode involved.
      - name: Check icon artifacts are current
        run: ./scripts/make-icon.sh verify

      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test

      - name: Assemble app bundle
        run: ./build.sh

      # Apple silicon only: exactly one slice, and it's arm64.
      - name: Verify bundle
        run: |
          set -euo pipefail
          lipo -info Sugarglider.app/Contents/MacOS/Sugarglider
          [[ "$(lipo -archs Sugarglider.app/Contents/MacOS/Sugarglider)" == "arm64" ]]
          codesign --verify --strict --verbose=2 Sugarglider.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Sugarglider.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Sugarglider.app/Contents/Info.plist

      - name: Package for download
        run: |
          mkdir -p dist
          # ditto, not zip: preserves the bundle's signature and symlinks.
          ditto -c -k --keepParent Sugarglider.app dist/Sugarglider.zip

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Sugarglider-${{ github.sha }}
          path: dist/Sugarglider.zip
          retention-days: 14
          if-no-files-found: error

  # The job above pins the oldest toolchain the package supports (Xcode 16,
  # Swift 6.0); this one runs the newest, which is what development happens
  # on. They disagree in both directions: Swift 6.4 infers array literals 6.0
  # rejects, and the macOS 27 SDK turns SwiftUI's @State into a macro. A
  # separate job rather than a matrix, because the ruleset requires
  # "Build & test" by that exact name and a matrix would rename it. Not a
  # required check itself while the image is a preview: no SLA, and its
  # queue can stall.
  test-newest:
    name: Build & test (newest Xcode)
    runs-on: xcode-27
    env:
      # The image's default Xcode lags the newest release, so select it
      # explicitly. Bump together with the runner label, deliberately.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test

      - name: Assemble app bundle
        run: ./build.sh

  lint:
    name: Lint shell scripts & workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # shellcheck ships with the Ubuntu runner image; actionlint does not.
      - name: shellcheck
        run: shellcheck build.sh scripts/*.sh

      # Pinned: an unpinned installer would let an upstream change break CI, and
      # this one is piped straight into bash.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.7"
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | tar xz actionlint
          ./actionlint -color

  release-scripts:
    name: Smoke-test release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The version/changelog logic decides what a release is *called* and what
      # it *says*, so a broken script must fail here rather than mid-release.
      - name: Exercise version + changelog generation
        run: |
          set -euo pipefail
          echo "latest tag:   $(scripts/version.sh latest)"
          echo "next (auto):  $(scripts/version.sh next auto)"
          echo "next (major): $(scripts/version.sh next major)"
          # Informational here — the release workflow is where this gates.
          echo "app:          $(scripts/version.sh app-changed || true)"
          echo "--- release notes preview ---"
          scripts/release-notes.sh "$(scripts/version.sh next auto)" | tee -a "$GITHUB_STEP_SUMMARY"
