name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a pull request cancels its running checks. Any other run gets
# a group of its own, so every commit on main keeps its result: within one
# group, GitHub also drops a queued run when a newer one arrives.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    # The oldest supported toolchain. Image and Xcode are pinned so a runner
    # update can't turn a green branch red overnight; bump them deliberately.
    runs-on: macos-26
    # A hung job would otherwise hold a runner for GitHub's 360-minute default.
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # Builds the app in Debug, runs the suite inside it and names failed tests.
      - name: Test
        run: scripts/test.sh

      # Every string in the app has a German translation.
      - name: Check localization
        run: scripts/check-localization.sh

      # Crafted Conventional Commits history; runs here too, on the release
      # interpreter, macOS' bash 3.2, which ubuntu's bash 5 can't stand in for.
      - name: Smoke-test version + changelog (bash 3.2)
        run: scripts/smoke-version-changelog.sh

      # Also checks the signature and the architecture, and names the SDK.
      - name: Assemble app bundle
        run: ./build.sh

  # The toolchain the release uses. The two toolchains reject different code,
  # in both directions. A separate job rather than a matrix, because the ruleset
  # requires "Build & test" by that exact name. Not required itself while the
  # image is a preview without an SLA.
  test-newest:
    name: Build & test (newest Xcode)
    # GitHub puts each Xcode major on its own image. Bump this label by hand
    # when the next major's image arrives; release.yml uses the same one.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Follows each new Xcode release on the image, never a beta or a release
      # candidate. So a new Xcode can turn this job red without a code change.
      - name: Select the newest stable Xcode
        run: |
          developer_dir="$(scripts/newest-xcode.sh)"
          echo "DEVELOPER_DIR=${developer_dir}" >> "$GITHUB_ENV"

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test
        run: scripts/test.sh

      # This Xcode extracts the strings the release ships.
      - name: Check localization
        run: scripts/check-localization.sh

      - name: Assemble app bundle
        run: ./build.sh

      # Built like the release, ad-hoc signed.
      - name: Package for download
        run: |
          mkdir -p dist
          # ditto, not zip: preserves the bundle's signature and symlinks.
          ditto -c -k --keepParent Sugarglider.app dist/Sugarglider.zip

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Sugarglider-${{ github.sha }}
          path: dist/Sugarglider.zip
          retention-days: 14
          if-no-files-found: error

  lint:
    name: Lint shell scripts & workflows
    # Pinned like the macOS images: shellcheck comes with the image, and a new
    # version could turn a green branch red overnight.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Preinstalled on the runner image, unlike actionlint.
      - name: shellcheck
        run: shellcheck build.sh scripts/*.sh

      # Version and checksum pinned, so an upstream release can neither break
      # nor tamper with this job.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict
          tar xzf "${tarball}" actionlint
          ./actionlint -color

  # A broken version or changelog script should fail here, not mid-release.
  release-scripts:
    name: Smoke-test release scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Crafted subjects: breaking bang, both footer spellings, prose mentioning
      # the phrase, case and description rules, prerelease tags, prepend
      # idempotence, and the failure paths the real history never shows.
      - name: Exercise version + changelog on crafted history
        run: scripts/smoke-version-changelog.sh

      - name: Preview release notes
        run: |
          set -euo pipefail
          echo "latest tag:   $(scripts/version.sh latest)"
          echo "next (auto):  $(scripts/version.sh next auto)"
          echo "next (major): $(scripts/version.sh next major)"
          # Informational; release.yml is where this gates.
          echo "app:          $(scripts/version.sh app-changed || true)"
          echo "--- release notes preview ---"
          scripts/release-notes.sh "$(scripts/version.sh next auto)" | tee -a "$GITHUB_STEP_SUMMARY"
