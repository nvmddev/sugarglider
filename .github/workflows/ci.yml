name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    # The oldest toolchain the package supports. Image and Xcode are pinned so a
    # rollover can't turn a green branch red overnight; bump them deliberately.
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # The icon artifacts are committed rather than compiled here (see
      # scripts/make-icon.sh), so this catches artwork edited without a recompile.
      - name: Check icon artifacts are current
        run: ./scripts/make-icon.sh verify

      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test

      - name: Assemble app bundle
        run: ./build.sh

      # build.sh already fails on a wrong SDK version; this shows what it recorded.
      - name: Verify bundle
        run: |
          set -euo pipefail
          binary=Sugarglider.app/Contents/MacOS/Sugarglider
          [[ "$(lipo -archs "${binary}")" == "arm64" ]]
          vtool -show-build "${binary}"
          codesign --verify --strict --verbose=2 Sugarglider.app
          for key in CFBundleIdentifier CFBundleShortVersionString LSMinimumSystemVersion; do
            /usr/libexec/PlistBuddy -c "Print :${key}" Sugarglider.app/Contents/Info.plist
          done

      - name: Package for download
        run: |
          mkdir -p dist
          # ditto, not zip: preserves the bundle's signature and symlinks.
          ditto -c -k --keepParent Sugarglider.app dist/Sugarglider.zip

      - name: Upload build
        uses: actions/upload-artifact@v7
        with:
          name: Sugarglider-${{ github.sha }}
          path: dist/Sugarglider.zip
          retention-days: 14
          if-no-files-found: error

  # The newest toolchain, which development happens on. It and the floor above
  # reject different code, in both directions. A separate job rather than a
  # matrix, because the ruleset requires "Build & test" by that exact name. Not
  # required itself while the image is a preview without an SLA.
  test-newest:
    name: Build & test (newest Xcode)
    runs-on: xcode-27
    env:
      # The image's default Xcode lags the newest release, so select it
      # explicitly. Bump together with the runner label, deliberately.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Build (debug)
        run: swift build

      - name: Test
        run: swift test

      - name: Assemble app bundle
        run: ./build.sh

  lint:
    name: Lint shell scripts & workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # shellcheck ships with the Ubuntu runner image; actionlint does not.
      - name: shellcheck
        run: shellcheck build.sh scripts/*.sh

      # Version and checksum pinned, so an upstream release can neither break
      # nor tamper with this job.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict
          tar xzf "${tarball}" actionlint
          ./actionlint -color

  release-scripts:
    name: Smoke-test release scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The version/changelog logic decides what a release is *called* and what
      # it *says*, so a broken script must fail here rather than mid-release.
      - name: Exercise version + changelog generation
        run: |
          set -euo pipefail
          echo "latest tag:   $(scripts/version.sh latest)"
          echo "next (auto):  $(scripts/version.sh next auto)"
          echo "next (major): $(scripts/version.sh next major)"
          # Informational here — the release workflow is where this gates.
          echo "app:          $(scripts/version.sh app-changed || true)"
          echo "--- release notes preview ---"
          scripts/release-notes.sh "$(scripts/version.sh next auto)" | tee -a "$GITHUB_STEP_SUMMARY"
