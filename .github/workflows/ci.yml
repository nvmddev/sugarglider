name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & test
    # The oldest supported toolchain. Image and Xcode are pinned so a runner
    # update can't turn a green branch red overnight; bump them deliberately.
    runs-on: macos-26
    # A hung job would otherwise hold a runner for GitHub's 360-minute default.
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.0.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      # Builds the app in Debug and runs the suite inside it.
      - name: Test
        run: xcodebuild test -quiet -project Sugarglider.xcodeproj -scheme Sugarglider -destination platform=macOS,arch=arm64

      # Crafted Conventional Commits history; runs here too, on the release
      # interpreter, macOS' bash 3.2, which ubuntu's bash 5 can't stand in for.
      - name: Smoke-test version + changelog (bash 3.2)
        run: scripts/smoke-version-changelog.sh

      - name: Assemble app bundle
        run: ./build.sh

      # macOS gives an app its current design only when it records a current SDK.
      - name: Verify bundle
        run: |
          set -euo pipefail
          binary=Sugarglider.app/Contents/MacOS/Sugarglider
          [[ "$(lipo -archs "${binary}")" == "arm64" ]]
          vtool -show-build "${binary}"
          codesign --verify --strict --verbose=2 Sugarglider.app
          for key in CFBundleIdentifier CFBundleShortVersionString LSMinimumSystemVersion; do
            /usr/libexec/PlistBuddy -c "Print :${key}" Sugarglider.app/Contents/Info.plist
          done

      - name: Package for download
        run: |
          mkdir -p dist
          # ditto, not zip: preserves the bundle's signature and symlinks.
          ditto -c -k --keepParent Sugarglider.app dist/Sugarglider.zip

      - name: Upload build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Sugarglider-${{ github.sha }}
          path: dist/Sugarglider.zip
          retention-days: 14
          if-no-files-found: error

  # The two toolchains reject different code, in both directions. A separate job
  # rather than a matrix, because the ruleset requires "Build & test" by that
  # exact name. Not required itself while the image is a preview without an SLA.
  test-newest:
    name: Build & test (newest Xcode)
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      # The image's default Xcode lags the newest release. Bump together with
      # the runner label.
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Test
        run: xcodebuild test -quiet -project Sugarglider.xcodeproj -scheme Sugarglider -destination platform=macOS,arch=arm64

      - name: Assemble app bundle
        run: ./build.sh

  lint:
    name: Lint shell scripts & workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Preinstalled on the runner image, unlike actionlint.
      - name: shellcheck
        run: shellcheck build.sh scripts/*.sh

      # Version and checksum pinned, so an upstream release can neither break
      # nor tamper with this job.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict
          tar xzf "${tarball}" actionlint
          ./actionlint -color

  # A broken version or changelog script should fail here, not mid-release.
  release-scripts:
    name: Smoke-test release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # Crafted subjects: breaking bang, both footer spellings, prose mentioning
      # the phrase, case and description rules, prerelease tags, prepend
      # idempotence, and the failure paths the real history never shows.
      - name: Exercise version + changelog on crafted history
        run: scripts/smoke-version-changelog.sh

      - name: Preview release notes
        run: |
          set -euo pipefail
          echo "latest tag:   $(scripts/version.sh latest)"
          echo "next (auto):  $(scripts/version.sh next auto)"
          echo "next (major): $(scripts/version.sh next major)"
          # Informational; release.yml is where this gates.
          echo "app:          $(scripts/version.sh app-changed || true)"
          echo "--- release notes preview ---"
          scripts/release-notes.sh "$(scripts/version.sh next auto)" | tee -a "$GITHUB_STEP_SUMMARY"
